version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: access-control-postgres-prod
    environment:
      POSTGRES_DB: access_control
      POSTGRES_USER: ${POSTGRES_USER:-access_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"  # Using port 5433 to avoid conflict with existing postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-access_control}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - access-control-network

  redis:
    image: redis:7-alpine
    container_name: access-control-redis-prod
    ports:
      - "6380:6379"  # Using port 6380 to avoid conflict with existing redis on 6379
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - access-control-network

  app:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: access-control-app-prod
    ports:
      - "3002:3000"  # Using port 3002 to avoid conflict with existing services
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-access_control}:${POSTGRES_PASSWORD}@postgres:5432/access_control
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=https://acm.callpro.mn
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - access-control-network

  nginx:
    image: nginx:alpine
    container_name: access-control-nginx-prod
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx-simple.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - access-control-network

  # Optional: Database backup service
  backup:
    image: postgres:15
    container_name: access-control-backup
    environment:
      POSTGRES_DB: access_control
      POSTGRES_USER: ${POSTGRES_USER:-access_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: /bin/bash -c "while true; do sleep 86400; /backup.sh; done"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - access-control-network

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  access-control-network:
    driver: bridge
