version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: acm-postgres-dev
    environment:
      POSTGRES_DB: acm_dev
      POSTGRES_USER: acm
      POSTGRES_PASSWORD: acm_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - acm_postgres_dev:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: acm-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: acm-mailpit-dev
    ports:
      - "1025:1025"  # SMTP — matches SMTP_HOST/PORT in .env
      - "8025:8025"  # Web UI at http://localhost:8025
    restart: unless-stopped

volumes:
  acm_postgres_dev:
